name: Check README links

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/link-check.yml
  pull_request:
    paths:
      - README.md
      - .github/workflows/link-check.yml
  schedule:
    # Weekly, so a link that rots on its own (a repo flipped to private,
    # a domain lapsing) surfaces without waiting for the next edit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Fail on template placeholders
        run: |
          if grep -nE 'YOUR-[A-Z0-9-]+|YOUR_[A-Z0-9_]+|<!-- *TODO|LOREM' README.md; then
            echo "::error file=README.md::README still contains template placeholders"
            exit 1
          fi
          echo "No placeholders found."

      - name: Check every link the way an anonymous visitor sees it
        env:
          # Deliberately NOT using GITHUB_TOKEN. An authenticated request makes
          # this account's private repos answer 200, which would hide the exact
          # bug this job exists to catch: linking a repo the public cannot open.
          UA: "readme-link-check (+https://github.com/SimaAlexandru99/SimaAlexandru99)"
          # Roughly where GitHub's camo image proxy stops waiting.
          SLOW_TTFB: "5.0"
        run: |
          set -uo pipefail

          mapfile -t urls < <(
            grep -oE 'https?://[^][ )"'"'"'<>]+' README.md \
              | sed -E 's/[.,;:]+$//' \
              | sort -u
          )

          echo "Found ${#urls[@]} unique URLs."
          dead=0
          warned=0
          skipped=0

          # Hosts that deliberately refuse automated clients from datacenter
          # IPs. LinkedIn answers 999 to every CI runner, forever. Reporting
          # that as a warning on every single run just teaches everyone to
          # ignore warnings, so these are reported as skipped instead.
          # A hard 404/410 from them is still a failure — see the case below.
          bot_blockers='^https?://([a-z0-9-]+\.)*(linkedin\.com|x\.com|twitter\.com|facebook\.com|instagram\.com)/'

          for url in "${urls[@]}"; do
            read -r code ttfb <<<"$(curl -sS -o /dev/null \
                     -w '%{http_code} %{time_starttransfer}' -L \
                     --max-time 25 --retry 2 --retry-delay 3 \
                     -A "$UA" "$url" 2>/dev/null || echo "000 0")"

            case "$code" in
              2??|3??)
                # A 200 is not enough for an image. GitHub proxies README
                # images through camo, which gives up after a few seconds --
                # so an endpoint that cold-starts for 20s renders as a broken
                # image even though curl eventually gets a 200. That is
                # exactly how a dead streak badge slipped past this check.
                if awk "BEGIN{exit !($ttfb > $SLOW_TTFB)}"; then
                  echo "::warning file=README.md::Slow (${ttfb}s to first byte): $url -- likely to render broken via camo"
                  warned=$((warned + 1))
                else
                  echo "  ok   $code  ${ttfb}s  $url"
                fi
                ;;
              404|410)
                # Unambiguously dead. This is the failure we care about.
                echo "::error file=README.md::Dead link ($code): $url"
                dead=$((dead + 1))
                ;;
              *)
                if [[ "$url" =~ $bot_blockers ]]; then
                  echo "  skip $code  $url  (host blocks automated checks)"
                  skipped=$((skipped + 1))
                else
                  # Rate limits, hotlink blocks and transient 5xx are common
                  # for badge services. Surface them, but never fail the build
                  # on them: a link checker that cries wolf is a link checker
                  # that gets ignored.
                  echo "::warning file=README.md::Unverified ($code): $url"
                  warned=$((warned + 1))
                fi
                ;;
            esac
          done

          echo
          echo "dead=$dead  unverified=$warned  skipped=$skipped  total=${#urls[@]}"
          if [ "$dead" -gt 0 ]; then
            echo "::error::$dead link(s) are dead for anonymous visitors."
            exit 1
          fi
